<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="../styles/style.css" />
    <title>Розбий блоки для ІПЗ!</title>
  </head>
  <body>
    <h1>Лабораторна робота для ІПЗ</h1>
    <button id="rules-btn" class="btn rules-btn" type="button">Правила гри</button>
    <section id="rules" class="rules" aria-label="Правила гри" aria-hidden="true">
      <h2>Як грати</h2>
      <p>Використовуй стрілки вліво та вправо, щоб рухати платформу й відбивати м'яч.</p>
      <p>Розбивай блоки, щоб набирати очки. За кожні 10 очок м'яч прискорюється.</p>
      <p>Якщо м'яч упаде, рахунок обнулиться, а блоки відновляться.</p>
      <button id="close-btn" class="btn" type="button">Закрити</button>
    </section>
    <canvas id="canvas" width="800" height="600" aria-label="Ігрове поле"></canvas>
    <p class="hint">Керування: ← →</p>
    <script src="../app/index.js"></script>
  </body>
</html>
